name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # pnpm first: setup-node v5 reads "packageManager" and needs pnpm on PATH for its cache.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:types

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/guardrail
      - name: Install cargo-near
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.23.0/cargo-near-installer.sh | sh
      - name: Contract unit tests
        run: pnpm contract:test
      - name: Build the contract wasm
        run: pnpm contract:build
      # near-kit downloads the sandbox binary to a temp dir then renames it under $HOME: keep both on one disk
      - name: Contract tests in a NEAR sandbox
        run: |
          mkdir -p "$HOME/.cache/tmp"
          TMPDIR="$HOME/.cache/tmp" SANDBOX=1 pnpm vitest run test/contract

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Scans the full history. Called directly (not via gitleaks-action), which fails on the
      # first push of a repository because its commit range starts at a commit with no parent.
      - name: Scan history for secrets (gitleaks)
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz -C /tmp gitleaks
          /tmp/gitleaks git --redact --verbose --exit-code 1 .
