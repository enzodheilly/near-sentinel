[package]
name = "near-sentinel-guardrail"
version = "0.1.0"
edition = "2021"
description = "On-chain guardrails for the NEAR Sentinel trading agent: policy, pause, decision log."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
